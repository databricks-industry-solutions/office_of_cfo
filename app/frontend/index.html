<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Self-Healing Close</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("cfo.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Canvas backdrop (overscroll / area revealed on scroll) stays consistent
         with the app background. Set here too so it applies before the bundled
         CSS loads, avoiding a flash. */
      html, body { background: #F6F5F2; }
      html.dark, html.dark body { background: #101217; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
